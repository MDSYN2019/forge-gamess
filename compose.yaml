services:
  gamess:
    image: ${GAMESS_IMAGE:-forge-gamess:local}
    build:
      context: .
      target: packaged
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:26.04}
    platform: linux/amd64
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 1gb
    cpus: ${GAMESS_CPUS:-2}
    mem_limit: ${GAMESS_MEMORY:-4g}
    pids_limit: 512
    volumes:
      - ./jobs:/work
      - ./scratch:/scratch
